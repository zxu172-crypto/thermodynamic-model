[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermodynamic-model"
version = "0.1.0"
description = "Thermodynamic model for antibody aggregation screening from PDB structures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
]

[project.scripts]
abthermo-screen = "abthermo_aggregation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
